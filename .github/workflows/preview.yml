name: Preview deploy

# Source lives on the `app` branch. GitHub Pages serves the `main` branch as
# built files, so this workflow builds the app and publishes it into
# `main/next/`, making the preview available at /dashboard/next/ while the
# live dashboard at /dashboard/ stays untouched.

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  deploy:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /dashboard/next/
      - uses: actions/checkout@v5
        with:
          ref: main
          path: site
      - name: Publish build into main/next/
        run: |
          rm -rf site/next
          cp -r dist site/next
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A next
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Preview: deploy ${GITHUB_SHA::7} to /next/"
            git push
          fi
